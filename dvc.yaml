# updated dvc.yaml

stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
    - src/data/data_ingestion.py
    params:
    - data_ingestion.test_size
    outs:
    - data/raw_data

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
    - data/raw_data
    - src/data/data_preprocessing.py
    outs:
    - data/processed_data

  feature_engineering:
    cmd: python src/feature/feature_engineering.py
    deps:
    - data/processed_data
    - src/feature/feature_engineering.py
    params:
    - feature_engineering.max_features
    outs:
    - data/feature_data
    - models/vectorizer.pkl

  model_building:
    cmd: python src/model/model_building.py
    deps:
    - data/feature_data
    - src/model/model_building.py
    outs:
    - models/model.pkl

  model_evaluation:
    cmd: python src/model/model_evaluation.py
    deps:
    - models/model.pkl
    - src/model/model_evaluation.py
    metrics:
    - reports/metrics.json
    outs:
    - reports/model_info.json  # Add the model_info.json file as an output (Include the ID of Latest Added Model, further used for model registration)

  model_registration:
    cmd: python src/model/register_model.py
    deps:
    - reports/model_info.json
    - src/model/register_model.py
